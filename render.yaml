services:
  - type: web
    name: smart-civic
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn smart_civic.wsgi:application --workers 2 --threads 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates a secure random value automatically
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "smart-civic.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-civic-db
          property: connectionString

databases:
  - name: smart-civic-db
    databaseName: smart_civic
    user: smart_civic
