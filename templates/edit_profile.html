{% extends 'base.html' %}
{% block content %}

<div class="max-w-md mx-auto mt-10 glass-card p-6">

    <h2 class="text-2xl font-bold mb-4">✏ Edit Profile</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" value="{{ request.user.username }}"
               class="w-full p-2 mb-3 rounded bg-gray-800 text-white">

        <input type="email" name="email" value="{{ request.user.email }}"
               class="w-full p-2 mb-3 rounded bg-gray-800 text-white">

        <button class="bg-blue-500 px-4 py-2 rounded text-white w-full">
            Save Changes
        </button>

    </form>

    <a href="/profile/" class="block mt-4 text-center text-blue-400">⬅ Back</a>

</div>

{% endblock %}
