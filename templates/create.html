{% extends 'base.html' %}
{% block content %}

<div class="max-w-6xl mx-auto px-4 py-6">

    <h2 class="text-2xl font-bold mb-6">📍 Create Complaint</h2>

    <div class="grid md:grid-cols-2 gap-6">

        <!-- 📝 FORM -->
        <form method="POST" enctype="multipart/form-data" class="glass-card space-y-4">
            {% csrf_token %}

            <input name="title" placeholder="Title"
                class="w-full p-3 rounded text-black">

            <input name="location" placeholder="Location"
                class="w-full p-3 rounded text-black">

            <textarea name="desc" placeholder="Description"
                class="w-full p-3 rounded text-black h-32"></textarea>

            <input type="file" name="image"
                class="w-full p-2 bg-white text-black rounded">

            <!-- Hidden lat/lng -->
            <input type="hidden" name="latitude" id="lat">
            <input type="hidden" name="longitude" id="lng">

            <button class="bg-green-500 w-full py-3 rounded btn-glow">
                Submit Complaint
            </button>
        </form>

        <!-- 🗺 MAP -->
        <div class="glass-card">

            <h3 class="mb-3">Click map to select location</h3>

            <div id="map" class="w-full h-[400px] rounded"></div>

        </div>

    </div>

</div>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([13.08, 80.27], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var marker;

map.on('click', function(e) {

    if (marker) {
        map.removeLayer(marker);
    }

    marker = L.marker(e.latlng).addTo(map);

    document.getElementById('lat').value = e.latlng.lat;
    document.getElementById('lng').value = e.latlng.lng;
});
</script>

{% endblock %}
