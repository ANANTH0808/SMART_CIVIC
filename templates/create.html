{% extends 'base.html' %}
{% block content %}

<div class="flex items-center justify-center min-h-screen">

    <form method="POST" enctype="multipart/form-data"
          class="glass p-8 w-96 text-center space-y-4">

        {% csrf_token %}

        <h2 class="text-2xl font-bold mb-4">📍 Create Complaint</h2>

        <!-- TITLE -->
        <input type="text" name="title"
               placeholder="Title"
               class="input w-full">

        <!-- DESCRIPTION -->
        <textarea name="desc"
                  placeholder="Description"
                  class="input w-full h-20"></textarea>

        <!-- LOCATION -->
        <input type="text" name="location"
               placeholder="Location (click on map)"
               class="input w-full">

        <!-- IMAGE UPLOAD -->
        <input type="file" name="image"
               class="text-white w-full">

        <!-- IMAGE PREVIEW -->
        <img id="preview"
             class="hidden rounded w-full"
             style="height:150px; object-fit:cover;">

        <!-- HIDDEN LAT LNG -->
        <input type="hidden" name="latitude" id="lat">
        <input type="hidden" name="longitude" id="lng">

        <!-- MAP -->
        <div id="map" class="rounded"
             style="height:250px;"></div>

        <!-- SUBMIT -->
        <button class="btn btn-blue w-full">
            Submit
        </button>

    </form>

</div>

<!-- 🌍 LEAFLET MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // 📍 MAP
    var map = L.map('map').setView([13.0827, 80.2707], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
        .addTo(map);

    var marker;

    map.on('click', function(e) {
        if (marker) map.removeLayer(marker);

        marker = L.marker(e.latlng).addTo(map);

        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;

        // Auto fill location
        document.querySelector('[name="location"]').value =
            "Lat: " + e.latlng.lat + ", Lng: " + e.latlng.lng;
    });

    // 🖼 IMAGE PREVIEW
    const input = document.querySelector('input[name="image"]');
    const preview = document.getElementById('preview');

    if (input) {
        input.addEventListener("change", function (e) {
            const file = e.target.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.classList.remove('hidden');
            }
        });
    }

});
</script>

{% endblock %}
