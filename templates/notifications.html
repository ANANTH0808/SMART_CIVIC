{% extends 'base.html' %}
{% block content %}

<div class="max-w-4xl mx-auto mt-10 glass-card p-6">

    <a href="/complaints/dashboard/" class="bg-blue-500 px-4 py-2 rounded text-white">⬅ Back</a>

    <h2 class="text-2xl font-bold mt-4 mb-4">🔔 Notifications</h2>

    {% for n in notes %}
        <div class="p-3 mb-2 bg-gray-800 rounded">
            {{ n.message }} <br>
            <small>{{ n.created_at }}</small>
        </div>
    {% empty %}
        <p>No notifications</p>
    {% endfor %}

</div>

{% endblock %}
