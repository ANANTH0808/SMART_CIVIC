<!DOCTYPE html>
<html>
<head>
    <title>Smart Civic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* 🌟 GLASS CARD */
        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* 🔥 HOVER GLOW */
        .glass-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 0 15px rgba(59,130,246,0.6),
                        0 0 30px rgba(59,130,246,0.4),
                        0 0 45px rgba(59,130,246,0.2);
        }

        /* ⚡ BUTTON GLOW */
        .btn-glow {
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 10px rgba(34,197,94,0.7),
                        0 0 20px rgba(34,197,94,0.5);
            transform: scale(1.05);
        }

        /* 💎 STATUS GLOW */
        .status-pending {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239,68,68,0.7);
        }

        .status-progress {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245,158,11,0.7);
        }

        .status-done {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34,197,94,0.7);
        }

    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-white min-h-screen">

 {% if user.is_authenticated %}
<!-- 🔝 NAVBAR -->
<div class="flex justify-between items-center px-6 py-3">

    <!-- LEFT: LOGO -->
    <h1 class="text-lg font-semibold tracking-wide">
        🚀 Smart Civic
    </h1>

    <!-- RIGHT: LINKS -->
    <div class="flex items-center gap-5 text-sm">

       

            <a href="/complaints/dashboard/" class="hover:text-blue-400 transition">Dashboard</a>
            <a href="/complaints/kanban/" class="hover:text-blue-400 transition">Kanban</a>
            <a href="/complaints/notifications/" class="hover:text-blue-400 transition">Notifications</a>
            <a href="/profile/" class="hover:text-blue-400 transition">Profile</a>

            <a href="/logout/" class="text-red-400 hover:text-red-300 transition">
                Logout
            </a>        

    </div>
    {% endif %}

</div>
{% block content %}{% endblock %}

</body>
</html>
