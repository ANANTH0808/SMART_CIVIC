{% extends 'base.html' %}
{% block content %}

<h2 class="text-2xl font-bold text-green-400 mb-6">🟢 Resolved</h2>

<div class="grid grid-cols-3 gap-6">
{% for c in complaints %}
<a href="/complaints/detail/{{ c.id }}/">
    <div class="glass p-4 card cursor-pointer">
        <h3 class="font-bold">{{ c.title }}</h3>
        <p class="text-gray-300">{{ c.desc|truncatechars:80 }}</p>
    </div>
</a>
{% empty %}
<p>No resolved issues</p>
{% endfor %}
</div>

{% endblock %}
