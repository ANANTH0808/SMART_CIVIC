{% extends 'base.html' %}
{% block content %}

<h2 class="text-2xl font-bold mb-6">🧩 Kanban Board</h2>

<div class="grid grid-cols-3 gap-6">

<!-- 🔴 Pending -->
<div class="glass p-4">
<h3 class="text-red-400 mb-3 font-bold">Pending</h3>

{% for c in pending %}
<a href="/complaints/detail/{{ c.id }}/">
    <div class="glass p-3 mb-2 card cursor-pointer">
        {{ c.title }}
    </div>
</a>
{% endfor %}
</div>

<!-- 🟡 Progress -->
<div class="glass p-4">
<h3 class="text-yellow-400 mb-3 font-bold">In Progress</h3>

{% for c in progress %}
<a href="/complaints/detail/{{ c.id }}/">
    <div class="glass p-3 mb-2 card cursor-pointer">
        {{ c.title }}
    </div>
</a>
{% endfor %}
</div>

<!-- 🟢 Resolved -->
<div class="glass p-4">
<h3 class="text-green-400 mb-3 font-bold">Resolved</h3>

{% for c in resolved %}
<a href="/complaints/detail/{{ c.id }}/">
    <div class="glass p-3 mb-2 card cursor-pointer">
        {{ c.title }}
    </div>
</a>
{% endfor %}
</div>

</div>

{% endblock %}
