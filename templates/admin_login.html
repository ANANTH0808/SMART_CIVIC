{% extends 'base.html' %}
{% block content %}

<div class="flex items-center justify-center min-h-screen">

    <div class="glass-card p-8 w-96 text-center">

        <h2 class="text-3xl font-bold mb-6">🔐 Admin Login</h2>

        {% if error %}
            <p class="text-red-400 mb-3">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username"
                   class="w-full p-2 mb-3 rounded bg-gray-800 text-white">

            <input type="password" name="password" placeholder="Password"
                   class="w-full p-2 mb-4 rounded bg-gray-800 text-white">

            <button class="bg-blue-500 w-full py-2 rounded text-white hover:shadow-lg">
                Login
            </button>
        </form>

        <a href="/" class="block mt-4 text-blue-400">⬅ Back to Home</a>

    </div>

</div>

{% endblock %}
